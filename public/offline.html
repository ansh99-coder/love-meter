<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Meter - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0012;
      color: #f5f0ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .heart {
      font-size: 64px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { color: #b9a9db; font-size: 14px; max-width: 300px; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: linear-gradient(120deg, #ff2f87, #7c3aff);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="heart">💗</div>
  <h1>You're Offline</h1>
  <p>Connect to the internet to use the Love Meter and discover your compatibility.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
